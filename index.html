<body><header><div class="identity"><span class="mark">鱼</span><div><strong>鱼干求职</strong><span class="sub">工作流程手册</span></div></div><span class="header-note">前端获客 / 后端交付</span></header>
<main><div class="intro"><div><div class="eyebrow">YUGAN · WORKFLOW</div><h1>从第一眼，到下一次信任。</h1><p>点击流程模块，查看这一阶段怎么做、交付什么、记录什么。</p></div><div class="logic">吸引合适的人<br>判断真实的问题<br>完成明确的承诺</div></div>
<div class="workspace"><section class="map" aria-label="求职服务流程图"><div class="lanes">
<section class="lane"><div class="lane-title"><span>01</span><h2>前端获客</h2><small>让合适的人认出自己的问题</small></div><div class="nodes" id="front"></div></section>
<section class="lane"><div class="lane-title"><span>02</span><h2>咨询成交</h2><small>判断需求与服务是否匹配</small></div><div class="nodes" id="consult"></div></section>
<section class="lane"><div class="lane-title"><span>03</span><h2>后端交付</h2><small>完成承诺，留下真实证据</small></div><div class="nodes" id="delivery"></div></section>
</div><div class="return"><span aria-hidden="true">↶</span><div><strong>复盘反哺客户定位与选题</strong><p>内容编号 → 咨询编号 → 订单编号，贯穿整个流程。</p></div></div></section>
